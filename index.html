<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>increment and decrement project</title>
    <style>
        body{
            background: linear-gradient(red,blue);
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        p{
            font-size: 60px;
            align-items: center;
            justify-content: center;
        }
        button{

            width: 30%;
            height: 53px;
            border-radius: 5px;
            font-size: 17px;
            border: none;
        }
        button:hover{
            transform: scale(1.08);
            transition: all 0.10s ease;
            background-color: rgb(7, 248, 7);
            color: #ffff;
        }

    </style>
</head>
<body>
    

    <p id="result">0</p>
    <button id="incrementbtn">increment + 1</button>
    <button id="decrementbtn">decrement - 1</button>
    <button id="increment">increment + 5</button>
    <button id="decrement">decrement - 5</button>
    <button id="reset">Reset</button>

    <script src="script.js"></script>
</body>
</html>
